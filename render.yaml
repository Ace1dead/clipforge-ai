services:
  - type: web
    name: clipforge-ai
    runtime: node
    plan: free
    startCommand: node dist-server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: ADMIN_KEY
        value: clipforge-admin-master-key-2026
      - key: JWT_SECRET
        value: clipforge-jwt-secret-2026-production
      - key: JWT_REFRESH_SECRET
        value: clipforge-jwt-refresh-secret-2026-production
      - key: ALLOWED_ORIGINS
        value: https://clipforge-ai-2ttg.onrender.com
