services:
  - type: web
    name: clipforge-ai
    runtime: node
    plan: free
    buildCommand: npm install && npx tsc -p tsconfig.server.json && npx tsc -b && npx vite build
    startCommand: node dist-server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: ADMIN_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
